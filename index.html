<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f4f4f4;
          padding: 20px;
        }
        .container {
          background: white;
          padding: 30px;
          border-radius: 8px;
          max-width: 500px;
          margin: auto;
          box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        h2 {
          text-align: center;
        }
        label {
          display: block;
          margin: 15px 0 5px;
        }
        input, select, textarea {
          width: 100%;
          padding: 8px;
          margin-top: 3px;
          border-radius: 4px;
          border: 1px solid #ccc;
        }
        button {
          margin-top: 20px;
          background: #28a745;
          color: white;
          padding: 10px;
          border: none;
          border-radius: 4px;
          width: 100%;
          font-size: 16px;
        }
        button:hover {
          background: #218838;
        }
      </style>
</head>
<body>
    <h1 style="text-align: center;">Feedback Survey Form</h1>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your Email" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number"  id="age" min="10" max="100">
        <br><br>

        <label for="gender">Gender:</label>
        <select name="gender" >
            <option value="">--Select--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <br><br>

        <label for="rating">How do you rate this course?</label>
        <select id="rating">
          <option>Excellent</option>
          <option>Good</option>
          <option>Average</option>
          <option>Poor</option>
        </select>
        <br><br>
    
        <label for="comments">Comments:</label>
        <br>
        <textarea id="comments" rows="4" cols="40" placeholder="Your feedback..."></textarea>
        <br><br>
    
        <input type="submit" value="Submit">
    </form>

</body>
</html>
